<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="yb-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1C1613" />
      <stop offset="100%" stop-color="#0C0A09" />
    </linearGradient>
    <linearGradient id="yb-orange" x1="12" y1="12" x2="52" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <!-- Dark rounded app tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#yb-bg)" stroke="#EA580C" stroke-opacity="0.4" stroke-width="2" />

  <!-- Top year progress / header bar -->
  <rect x="13" y="14" width="38" height="6" rx="3" fill="url(#yb-orange)" />

  <!-- Row 1: Work (Blue) + muted days -->
  <rect x="13" y="25" width="21" height="7" rx="3" fill="#6B95F0" />
  <rect x="37" y="25" width="6" height="7" rx="2.5" fill="#FFFFFF" fill-opacity="0.14" />
  <rect x="45" y="25" width="6" height="7" rx="2.5" fill="#FFFFFF" fill-opacity="0.14" />

  <!-- Row 2: Learning (Purple) + Perfect Week (Green) -->
  <rect x="13" y="35" width="13" height="7" rx="3" fill="#A183EE" />
  <rect x="29" y="35" width="22" height="7" rx="3" fill="#43B583" />

  <!-- Row 3: Travel (Amber) + Current "NOW" week pill -->
  <rect x="13" y="45" width="17" height="7" rx="3" fill="#D4A94F" />
  <rect x="33" y="45" width="18" height="7" rx="3" fill="#F5F5F4" />
</svg>
